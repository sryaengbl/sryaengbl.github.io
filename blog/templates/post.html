<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ post.title }} · Blog</title>
    <link rel="stylesheet" href="{{ url('static', path='style.css') }}">
  </head>
  <body>
    <main>
      <nav aria-label="Navigation"><a href="{{ url('index') }}">← All posts</a></nav>
      <article>
        <header>
          <p class="muted">{{ post.section_label }}</p>
          <h1>{{ post.title }}</h1>
          <p class="muted">Updated <time datetime="{{ post.updated.iso }}">{{ post.updated.label }}</time></p>
        </header>
        {{ post.content | safe }}
      </article>
    </main>
  </body>
</html>
